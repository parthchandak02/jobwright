name: privacy
on:
  push:
  pull_request:
jobs:
  personal-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No personal data in tracked files
        run: python3 scripts/check_private_data.py --all
      - name: No personal data in pushed commits
        if: github.event_name == 'push' && !startsWith(github.event.before, '00000000')
        run: python3 scripts/check_private_data.py --push "${{ github.event.before }}..${{ github.sha }}"
