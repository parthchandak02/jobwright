name: privacy
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  personal-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: No personal data in tracked files
        run: python3 scripts/check_private_data.py --all
      - name: No personal data in pushed commits
        if: github.event_name == 'push' && !startsWith(github.event.before, '00000000')
        run: python3 scripts/check_private_data.py --push "${{ github.event.before }}..${{ github.sha }}"
