name: privacy
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  personal-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: No personal data in tracked files
        run: python3 scripts/check_private_data.py --all
      - name: No personal data in pushed commits
        if: github.event_name == 'push' && !startsWith(github.event.before, '00000000')
        run: python3 scripts/check_private_data.py --push "${{ github.event.before }}..${{ github.sha }}"
