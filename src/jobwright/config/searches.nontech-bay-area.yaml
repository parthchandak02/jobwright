# Non-technical search template (social impact / CSR / philanthropy / CoS slice)
# Seed with: jobwright users add <id> --template nontech-bay-area
# Or copy to users/<id>/searches.yaml
# Fast daily mode (DISCOVER_MODE=fast) runs tier: 1 only.

queries:
  # Tier 1 - daily. Distinct families for impact/CSR/foundation plus one CoS query.
  - query: "social impact program manager"
    tier: 1
  - query: "corporate social responsibility"
    tier: 1
  - query: "community impact"
    tier: 1
  - query: "foundation program officer"
    tier: 1
  - query: "philanthropy manager"
    tier: 1
  - query: "head of partnerships nonprofit"
    tier: 1
  - query: "impact investing associate"
    tier: 1
  - query: "chief of staff"
    tier: 1
  # Tier 2 - full mode / weekly deep crawl
  - query: "corporate purpose"
    tier: 2
  - query: "community investment"
    tier: 2
  - query: "data for good program manager"
    tier: 2
  - query: "portfolio director nonprofit"
    tier: 2
  - query: "employee engagement CSR"
    tier: 2
  - query: "foundation partnerships"
    tier: 2
  - query: "social impact strategy"
    tier: 2
  - query: "venture platform manager"
    tier: 2
  # Tier 3 - rare / broad
  - query: "nonprofit strategy consultant"
    tier: 3
  - query: "venture philanthropy"
    tier: 3
  - query: "strategic partnerships nonprofit"
    tier: 3
  - query: "FUSE fellow"
    tier: 3

locations:
  # SF covers the Bay Area ~50-mile LinkedIn/Indeed radius (SJ/Oakland/Palo Alto overlap).
  - location: "San Francisco, CA"
    remote: false
  - location: "New York, NY"
    remote: false
  - location: "Los Angeles, CA"
    remote: false
  - location: "Remote"
    remote: true

location:
  accept_patterns:
    - "San Francisco"
    - "Bay Area"
    - "SF"
    - "San Jose"
    - "Oakland"
    - "Palo Alto"
    - "Mountain View"
    - "Berkeley"
    - "California"
    - ", CA"
    - " CA "
    - "New York"
    - "NYC"
    - "Manhattan"
    - "Brooklyn"
    - "Los Angeles"
    - "Atlanta"
    - "Wilmington"
    - "Remote"
    - "Anywhere"
    - "United States"
    - "US"
    - "USA"
  reject_patterns:
    - "Seattle only"
    - "onsite only"
    - "London, UK"
    - "India"
    - "Philippines"
    - "Bangalore"
    - "Hyderabad"
    - "Calgary"
    - "Toronto"
    - "Ontario"
    - "Alberta"
    - "Saskatchewan"
    - "Manitoba"
    - "Quebec"
    - "Vancouver"
    - "Montreal"
    - "etobicoke"
    - "Canada"
    - "Canada only"
    - "(ON)"
    - "(AB)"
    - "(SK)"
    - "(BC)"
    - "(QC)"

country: "USA"

boards:
  - indeed
  - linkedin
  - glassdoor
  - zip_recruiter
  - google

defaults:
  results_per_site: 50
  hours_old: 72          # 3-day window; dedup + known-URL skip prevent re-spam. Override per-run with JOBWRIGHT_HOURS_OLD.

# Drop technical / deep-specialist / GTM noise (case-insensitive substring)
exclude_titles:
  - "software engineer"
  - "software developer"
  - "backend engineer"
  - "frontend engineer"
  - "full stack"
  - "fullstack"
  - "devops"
  - "sre"
  - "site reliability"
  - "data engineer"
  - "data scientist"
  - "machine learning"
  - "ml engineer"
  - "ai engineer"
  - "security engineer"
  - "platform engineer"
  - "cloud engineer"
  - "infrastructure engineer"
  - "qa engineer"
  - "test engineer"
  - "embedded"
  - "firmware"
  - "hardware engineer"
  - "intern"
  - "internship"
  - "co-op"
  - "ESG analyst"
  - "climate scientist"
  - "quantitative analyst"
  - "investment banking"
  - "private equity associate"
  - "technical program manager"
  - "it program manager"
  - "developer relations"
  - "solutions architect"
  - "partner engineer"
  - "account executive"
  - "customer success"
  - "executive assistant"
  - "office manager"
  - "people operations"
  - "talent acquisition"
  - "recruiter"
  - "sales development"
  - "police officer"

# Annual USD floor - jobs clearly below this are dropped at discovery when salary is known
min_salary: 115000

exclude_companies:
  - NVIDIA
  - Intel
  - Moderna
  - Motorola Solutions
  - Cisco
  - BlackBerry
